on:
  push:
    branches:
    - 'master'
  schedule:
  - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  actions: write
  pages: write
env:
  ISSUES: repos/nextzlog/todo/issues
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
jobs:
  Prepare:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: autodyne/fava
        path: repos/fava
    - uses: actions/checkout@v4
      with:
        repository: autodyne/mine
        path: repos/mine
    - run: |
        sudo apt update
        sudo apt install pandoc poppler-utils
    - run: |
        mkdir -p zenn/images
        cp files/*/*.png repos/*/images/*.png zenn/images
        for book in ats4 chpl dusk fava mine; do
          pandoc lua books/zenn.lua $book zenn
        done
        cp books/*.pdf pages
        sed -i "s/site\.\(css\|js\)'/site.\1?v=${GITHUB_SHA::7}'/" pages/*.html
    - run: gh api "$ISSUES?per_page=6" > pages/issues.json
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: pages
    - uses: peaceiris/actions-gh-pages@v3
      with:
        publish_dir: zenn
        publish_branch: zenn
        github_token: ${{secrets.GITHUB_TOKEN}}
  Publish:
    needs: Prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
  Sustain:
    runs-on: ubuntu-latest
    steps:
    - run: gh workflow enable build.yaml
      env:
        GH_REPO: ${{github.repository}}
